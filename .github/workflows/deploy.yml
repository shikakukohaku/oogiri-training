name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # マージするまでは作業ブランチからも公開する。マージ後はこの行を消してよい。
      - claude/oogiri-ideation-training-mvp-cy4uwr
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開は同時に1つだけ。走行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v5

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
